<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Console Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body { 
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .security-scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            animation: scanning 3s infinite linear;
            opacity: 0.5;
        }

        @keyframes scanning {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .admin-card {
            border: 1px solid rgba(59, 130, 246, 0.2);
            position: relative;
            overflow: hidden;
        }

        .admin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body class="p-6">

    <div class="glass admin-card w-full max-w-md p-12 rounded-[2.5rem] shadow-2xl animate-scale-up">
        <div class="security-scan"></div>
        
        <div class="text-center mb-12">
            <div class="bg-blue-600/10 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-blue-500/20 shadow-lg shadow-blue-500/10">
                <i class="fa-solid fa-shield-halved text-blue-500 text-4xl"></i>
            </div>
            <h1 class="text-4xl font-black text-white italic tracking-tighter uppercase mb-2">CONSOLE <span class="text-blue-500">ADMIN</span></h1>
            <p class="text-slate-500 text-xs font-black uppercase tracking-[0.3em]">Protocolo de Segurança Ativo</p>
        </div>

        <div id="login-form" class="space-y-8 animate-fade-in">
            <div class="space-y-3">
                <label class="block text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 ml-2">Chave de Acesso Master</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-5 text-slate-500 group-focus-within:text-blue-500 transition-colors">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="admin-pass" 
                        class="w-full bg-slate-900/50 border border-slate-800 p-5 pl-12 rounded-2xl text-white outline-none transition-all placeholder:text-slate-800 font-bold" 
                        placeholder="••••••••••••">
                </div>
            </div>

            <button onclick="verificarAcesso()" class="btn-primary w-full py-5 rounded-2xl flex items-center justify-center gap-3 uppercase text-xs tracking-widest">
                <span>Autenticar Console</span>
                <i class="fa-solid fa-fingerprint text-lg"></i>
            </button>

            <button onclick="mostrarRecuperar()" class="w-full text-slate-600 hover:text-blue-400 text-[10px] font-black uppercase tracking-[0.2em] transition-colors">
                Solicitar Reset de Credenciais
            </button>
        </div>

        <div id="recovery-form" class="hidden space-y-8 animate-fade-in">
            <p class="text-slate-400 text-sm text-center px-6 leading-relaxed">Insira o e-mail administrativo para receber os protocolos de recuperação.</p>
            <div class="relative group">
                <span class="absolute inset-y-0 left-0 flex items-center pl-5 text-slate-500 group-focus-within:text-blue-500 transition-colors">
                    <i class="fa-solid fa-envelope"></i>
                </span>
                <input type="email" id="recovery-email" 
                    class="w-full bg-slate-900/50 border border-slate-800 p-5 pl-12 rounded-2xl text-white outline-none transition-all placeholder:text-slate-800" 
                    placeholder="suporte@gateway.com">
            </div>
            
            <button id="btn-enviar-codigo" onclick="enviarCodigo()" class="btn-primary w-full py-5 rounded-2xl flex justify-center items-center gap-3 uppercase text-xs tracking-widest">
                <span>Enviar Protocolo</span>
            </button>
            
            <button onclick="voltarLogin()" class="w-full text-slate-600 text-[10px] font-black uppercase tracking-[0.2em] hover:text-white transition-colors">
                <i class="fa-solid fa-chevron-left mr-2"></i> Voltar ao Acesso
            </button>
        </div>
        
        <div class="mt-12 pt-8 border-t border-white/5 flex items-center justify-center gap-4 grayscale opacity-30">
            <i class="fa-solid fa-lock text-xl"></i>
            <i class="fa-solid fa-user-shield text-xl"></i>
            <i class="fa-solid fa-server text-xl"></i>
        </div>
    </div>

    <script>
        function verificarAcesso() {
            const senha = document.getElementById('admin-pass').value;
            if (senha === "2024") { 
                sessionStorage.setItem('admin_autenticado', 'true');
                sessionStorage.setItem('admin_role', 'master');
                sessionStorage.setItem('admin_nome', 'Administrador Master');
                window.location.href = 'admin.html';
            } else {
                alert("⚠️ Acesso Negado: Assinatura digital inválida.");
                document.getElementById('admin-pass').value = "";
                document.getElementById('admin-pass').focus();
            }
        }

        function mostrarRecuperar() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('recovery-form').classList.remove('hidden');
        }

        function voltarLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('recovery-form').classList.add('hidden');
        }

        async function enviarCodigo() {
            const emailInput = document.getElementById('recovery-email');
            const btn = document.getElementById('btn-enviar-codigo');
            const email = emailInput.value.trim();

            if(!email) return alert("Por favor, digite o e-mail administrativo.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> PROCESSANDO...';

            try {
                const response = await fetch('/api/recuperar-senha', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (response.ok) {
                    alert("✅ Protocolo enviado. Verifique a caixa de entrada administrativa.");
                    voltarLogin();
                } else {
                    alert("❌ Falha: " + (result.error || "Não foi possível processar o pedido."));
                }
            } catch (err) {
                alert("❌ Erro crítico de comunicação com o servidor.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Enviar Protocolo';
            }
        }

        document.getElementById('admin-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verificarAcesso();
        });
    </script>
</body>
</html>
